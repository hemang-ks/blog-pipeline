[project]
name = "blogpipe"
version = "0.1.0"
description = "Local pipeline that turns a topic folder into a researched, cited, publish-ready blog post."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "httpx>=0.27",
    "pymupdf4llm>=0.0.9",
    "markdown-it-py>=3.0",
]

[project.scripts]
blog = "blogpipe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blogpipe"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
